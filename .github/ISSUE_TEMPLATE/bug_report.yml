name: Bug report
description: Report a reproducible problem with T3 + Bots.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This is the independent T3 + Bots fork. Remove secrets, pairing links and private messages from all evidence.
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Hermes version
      placeholder: Ubuntu version, architecture, Hermes version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Bot chat or team discussions
        - Bot computer or browser
        - Voice or dictation
        - Existing Hermes profile / Discord / Telegram
        - Installer or startup
        - Normal T3 coding workflow
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Optional. Use fictional content where possible.
