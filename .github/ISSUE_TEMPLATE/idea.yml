name: Idea or feedback
description: Suggest a focused improvement to the bot experiment.
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Ideas here are for this independent experiment, not proposals for official T3.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the workflow or problem first.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
    validations:
      required: true
