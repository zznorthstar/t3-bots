name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and pinned runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout app and runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify public entry points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, xml.etree.ElementTree as ET
          for name in ['README.md', 'CONTRIBUTING.md', 'NOTICE.md', 'CHANGELOG.md', '.github/SECURITY.md']:
              path = Path(name)
              for link in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if link.startswith(('https://', 'http://', '#', 'mailto:')):
                      continue
                  target = path.parent / link.split('#', 1)[0]
                  assert target.exists(), f'{name}: missing {link}'
          for path in Path('.github/readme').glob('*.svg'):
              tree = ET.parse(path)
              assert not any(node.tag.endswith('script') for node in tree.iter()), path
          recorded = subprocess.check_output(['git', 'ls-tree', 'HEAD', 'runtime/bot-hq'], text=True).split()[2]
          actual = subprocess.check_output(['git', '-C', 'runtime/bot-hq', 'rev-parse', 'HEAD'], text=True).strip()
          assert recorded == actual, 'Runtime differs from pinned commit'
          assert Path('runtime/bot-hq/LICENSE').is_file()
          print('Public docs, illustrations and pinned runtime verified.')
          PY

  runtime:
    name: Bot runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/bot-hq
    steps:
      - name: Checkout app and runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/bot-hq/package-lock.json
      - run: npm ci --allow-scripts=better-sqlite3,esbuild --no-audit --no-fund
      - run: npm run build -w server
      - run: npm run typecheck -w server
      - name: Auth, ownership, profiles and desktop transport
        run: node --test tests/chat-features.test.mjs tests/local-desktop.test.mjs
      - name: Telegram migration isolation
        run: python3 tests/migrate-telegram-profile.test.py
